<style>
/* Layout: banco de trabajo de dos columnas — red + controles a la izquierda, cálculo + tabla a la derecha; una columna en móvil */

  --bg:#0C1722; --surface:#132335; --ink:#E6EDF3; --ink-2:#D3E3EF; --muted:#8EA6BC; --line:#25394F;

  --on-teal:#06161D; --on-amber:#0F1B2D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}

.tabs button{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink-2);color:var(--bg)}

@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font:600 13px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

button:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.calc li{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:8px;background:var(--bg);border:1px solid transparent;cursor:pointer;overflow-wrap:anywhere}

.practice[hidden]{display:none}
.practice p{margin:0}
.legend svg{display:inline-block;width:26px;height:10px;flex:none}
.practice .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feedback{font-weight:600}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.score{font:600 13px var(--f-mono);color:var(--ink-2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:520px}
th,td{border:1px solid var(--line);padding:6px 6px;text-align:center}

td small{display:block;font:500 11px var(--f-mono);color:var(--muted)}
td.lbl{font:500 13px var(--f-mono);background:var(--bg);white-space:nowrap}
td.upd{background:var(--amber-soft)}
tr.cur td{box-shadow:inset 0 2px 0 var(--teal), inset 0 -2px 0 var(--teal)}

.node:focus{outline:none}
.node:focus-visible circle.ring{stroke:var(--amber);stroke-width:4}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.node.flash{animation:pop .45s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.node.wrong{animation:shake .3s;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){.node.flash,.node.wrong{animation:none}.switch input,.switch input::after{transition:none}}

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Stallings · Capítulo 10 · Apéndice 10A · Red de la Fig. 10.6</div>
      <h1 id="title">Ejercicio 10.10 · Dijkstra desde el nodo 2</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="tabs" role="tablist" aria-label="Ejercicio">
      <button role="tab" id="tab-dijkstra" aria-selected="true">10.10 · Dijkstra</button>
      <button role="tab" id="tab-bellman" aria-selected="false">10.11 · Bellman-Ford</button>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="panel" aria-label="Red y controles">
        <h2>Red · haz clic en un nodo</h2>
        <svg id="graph" viewBox="0 0 640 370" role="img" aria-label="Red de seis nodos con costes dirigidos"></svg>
        <div class="legend" id="legend"></div>
        <div class="toolbar">
          <button class="btn" id="b-reset" title="Volver al inicio">⟲ Reiniciar</button>
          <button class="btn" id="b-back" title="Paso anterior (←)">← Anterior</button>
          <button class="btn primary" id="b-next" title="Siguiente paso (→)">Siguiente →</button>
          <button class="btn" id="b-play">▶ Reproducir</button>
          <span class="spacer"></span>
        </div>
        <div class="toolbar">
          <label class="field" for="src">Nodo origen
            <select id="src">
              <option value="1">1</option><option value="2" selected>2 (ejercicio)</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            </select>
          </label>

          <label class="switch" for="practice"><input type="checkbox" id="practice"> Modo práctica</label>

      </section>

<script>
(function(){
const N=[1,2,3,4,5,6];
const COST={'1-2':2,'2-1':3,'1-3':5,'3-1':8,'1-4':1,'4-1':7,'2-3':3,'3-2':6,'2-4':2,'4-2':2,'3-4':3,'4-3':3,'3-5':1,'5-3':1,'3-6':5,'6-3':8,'4-5':1,'5-4':1,'5-6':2,'6-5':4};
const EDGES=[[1,2],[1,3],[1,4],[2,3],[2,4],[3,4],[3,5],[3,6],[4,5],[5,6]];
const POS={1:[70,190],2:[205,62],3:[430,62],4:[250,305],5:[450,305],6:[585,185]};
const BADGE_UP={2:1,3:1};
const W=(i,j)=>i===j?0:(COST[i+'-'+j]??Infinity);
const f=v=>isFinite(v)?String(v):'∞';
const ps=p=>p?p.join('-'):'—';
const $=id=>document.getElementById(id);

let algo='dijkstra', src=2, practice=false, hist=[], sel=null, pick=new Set(), fb=null, score={ok:0,tries:0}, timer=null, flash=[], wrong=null;

/* ---------- Dijkstra ---------- */
function dInit(s){const L={},P={};N.forEach(n=>{L[n]=n===s?0:W(s,n);P[n]=n===s?[s]:(isFinite(L[n])?[s,n]:null)});
  return {T:[s],L,P,x:null,changed:N.filter(n=>n!==s&&isFinite(L[n])),calc:[]};}
function dCands(st){const out=N.filter(n=>!st.T.includes(n));const m=Math.min(...out.map(n=>st.L[n]));return out.filter(n=>st.L[n]===m);}
function dStep(st,x){const T=[...st.T,x],L={...st.L},P={...st.P},changed=[],calc=[];
  N.forEach(n=>{if(T.includes(n))return;const w=W(x,n),via=L[x]+w;calc.push({n,old:st.L[n],lx:L[x],w,via});
    if(via<L[n]){L[n]=via;P[n]=[...P[x],n];changed.push(n);}});
  return {T,L,P,x,changed,calc};}
const dDone=st=>st.T.length===N.length;

/* ---------- Bellman-Ford ---------- */
function bInit(s){const L={},P={};N.forEach(n=>{L[n]=n===s?0:Infinity;P[n]=n===s?[s]:null});return {h:0,L,P,changed:[],calc:{},done:false};}
function bStep(st){const L={},P={},changed=[],calc={};
  N.forEach(n=>{if(n===src){L[n]=0;P[n]=[src];return;}
    let best=st.L[n],bp=st.P[n];const c=[];
    N.forEach(j=>{if(j===n)return;const w=W(j,n);if(!isFinite(w))return;const v=st.L[j]+w;c.push({j,lj:st.L[j],w,v});
      if(v<best){best=v;bp=[...st.P[j],n];}});
    calc[n]=c;L[n]=best;P[n]=bp;if(best<st.L[n])changed.push(n);});
  return {h:st.h+1,L,P,changed,calc,done:changed.length===0};}

const cur=()=>hist[hist.length-1];
const isDone=()=>algo==='dijkstra'?dDone(cur()):cur().done;
const others=()=>N.filter(n=>n!==src);

function reset(){stop();hist=[algo==='dijkstra'?dInit(src):bInit(src)];sel=null;pick.clear();fb=null;flash=[];render();}
function next(auto){
  if(isDone())return;
  const st=cur();
  if(algo==='dijkstra'){const x=dCands(st)[0];hist.push(dStep(st,x));}
  else hist.push(bStep(st));
  if(practice&&!auto){fb={ok:false,text:'Respuesta mostrada. Intenta el siguiente paso.'};}
  else if(!practice) fb=null;
  pick.clear();flash=cur().changed.concat(algo==='dijkstra'&&cur().x?[cur().x]:[]);render();
}
function back(){stop();if(hist.length>1){hist.pop();pick.clear();fb=null;flash=[];render();}}
function play(){if(timer){stop();render();return;}if(isDone())reset();
  timer=setInterval(()=>{if(isDone()){stop();render();return;}next(true);},1300);render();}
function stop(){if(timer){clearInterval(timer);timer=null;}}

/* ---------- Práctica ---------- */
function nodeClick(n){
  stop();
  if(practice&&!isDone()){
    if(algo==='dijkstra'){
      const st=cur();if(st.T.includes(n)){fb={ok:false,text:'El nodo '+n+' ya está en T. Elige uno de fuera.'};render();return;}
      score.tries++;const c=dCands(st);
      if(c.includes(n)){score.ok++;hist.push(dStep(st,n));sel=null;
        const ch=cur().changed;fb={ok:true,text:'¡Correcto! Entra el '+n+' con L = '+f(st.L[n])+'.'+(ch.length?' Se actualiza: '+ch.map(k=>'L('+k+')').join(', ')+'.':' No mejora a nadie.')};
        flash=ch.concat([n]);}
      else{const m=st.L[c[0]];fb={ok:false,text:'No. L('+n+') = '+f(st.L[n])+', pero hay nodos fuera de T con L = '+f(m)+'.'};wrong=n;}
      render();return;
    }else{ if(n===src)return; pick.has(n)?pick.delete(n):pick.add(n); fb=null; render(); return; }
  }
  sel=n;render();
}
function bCheck(){
  const st=cur(),nx=bStep(st),truth=new Set(nx.changed);score.tries++;
  const same=truth.size===pick.size&&[...truth].every(k=>pick.has(k));
  if(same){score.ok++;hist.push(nx);flash=nx.changed;
    fb={ok:true,text:nx.done?'¡Correcto! Ningún valor cambia: el algoritmo termina.':'¡Correcto! Cambian '+nx.changed.map(k=>'L('+k+')').join(', ')+'.'};pick.clear();}
  else{const miss=[...truth].filter(k=>!pick.has(k)),extra=[...pick].filter(k=>!truth.has(k));
    fb={ok:false,text:'Aún no.'+(miss.length?' Te falta algún nodo que sí mejora.':'')+(extra.length?' Marcaste '+extra.join(', ')+', que no mejora'+(extra.length>1?'n':'')+'.':'')+' Pista: revisa L'+sub(st.h)+'(j) + w(j,n) para cada vecino j.'};}
  render();
}
const SUBS='₀₁₂₃₄₅₆₇₈₉';const sub=k=>String(k).split('').map(d=>SUBS[+d]).join('');

/* ---------- Render ---------- */
function render(){
  const st=cur(),done=isDone(),D=algo==='dijkstra';
  $('tab-dijkstra').setAttribute('aria-selected',D);$('tab-bellman').setAttribute('aria-selected',!D);
  const ej=src===2?(D?'Ejercicio 10.10 · ':'Ejercicio 10.11 · '):'';
  $('title').textContent=ej+(D?'Dijkstra':'Bellman-Ford')+' desde el nodo '+src;
  $('subtitle').textContent=D?'Encuentra los caminos en orden creciente de coste: en cada iteración entra a T el nodo más cercano al origen.'
    :'Calcula el mejor camino con a lo sumo h enlaces: h = 1, 2, 3… hasta que ningún valor cambie.';
  $('b-back').disabled=hist.length<=1;$('b-next').disabled=done;
  $('b-play').textContent=timer?'❚❚ Pausa':'▶ Reproducir';
  $('b-next').textContent=practice&&!done?'Mostrar respuesta →':'Siguiente →';
  // estado
  if(D){$('step').textContent='Iteración '+st.T.length+' de '+N.length;}
  else{$('step').textContent='h = '+st.h;}
  const pill=$('pill');pill.textContent=done?'Terminado':(D?'T = {'+st.T.join(', ')+'}':'Caminos de ≤ '+st.h+' enlace'+(st.h===1?'':'s'));
  pill.className='pill'+(done?' done':'');
  renderExplain(st,D,done);renderPractice(st,D,done);renderGraph(st,D);renderTable(D);renderResult(st,done);
  try{localStorage.setItem('mc-algo',algo)}catch(e){}
}

function renderExplain(st,D,done){
  const ex=$('explain'),ul=$('calc');ul.innerHTML='';
  const li=(html,cls,n)=>{const e=document.createElement('li');e.innerHTML=html;if(cls)e.className=cls;if(n!=null){e.onclick=()=>{sel=n;render();};}ul.appendChild(e);};
  if(D){
    if(st.x==null){ex.innerHTML='<b>Paso 1.</b> T = {'+src+'}. Cada L(n) empieza con el coste directo w('+src+', n); si no hay enlace, ∞.';
      others().forEach(n=>li('L('+n+') = w('+src+','+n+') = '+f(st.L[n]),(sel===n?'sel ':'')+(isFinite(st.L[n])?'upd':''),n));}
    else{ex.innerHTML='<b>Paso 2.</b> Entra a T el nodo <b>'+st.x+'</b> (menor L fuera de T = '+f(hist[hist.length-2].L[st.x])+'). '+
      (st.calc.length?'<b>Paso 3.</b> Para cada nodo fuera de T: L(n) = min[ L(n), L('+st.x+') + w('+st.x+', n) ].':'Todos los nodos están en T.');
      st.calc.forEach(c=>{const up=c.via<c.old;
        li('L('+c.n+') = min[ '+f(c.old)+', '+c.lx+' + '+f(c.w)+' ] = '+f(Math.min(c.old,c.via))+(up?'<span class="note">mejora</span>':''),(up?'upd ':'')+(sel===c.n?'sel':''),c.n);});}
    if(done)ex.innerHTML+=' <b>T contiene todos los nodos: fin.</b>';
  }else{
    if(st.h===0){ex.innerHTML='<b>Paso 1.</b> L'+sub(0)+'('+src+') = 0 y L'+sub(0)+'(n) = ∞ para el resto: con 0 enlaces solo se alcanza el origen.';return;}
    const prev=hist[hist.length-2];
    let n=sel&&sel!==src?sel:(st.changed[0]||others()[others().length-1]);
    ex.innerHTML='<b>Paso 2.</b> L'+sub(st.h)+'(n) = min<sub>j</sub>[ L'+sub(st.h-1)+'(j) + w(j, n) ]. Cálculo para el nodo <b>'+n+'</b> (toca otro nodo para verlo):'+
      (st.done?' <b>Ningún valor cambió respecto a h = '+(st.h-1)+': fin.</b>':'');
    const best=st.L[n];
    li('j = '+n+' (seguir igual): L'+sub(st.h-1)+'('+n+') = '+f(prev.L[n]),prev.L[n]===best&&!st.changed.includes(n)?'best':'');
    (st.calc[n]||[]).forEach(c=>li('j = '+c.j+': L'+sub(st.h-1)+'('+c.j+') + w('+c.j+','+n+') = '+f(c.lj)+' + '+c.w+' = '+f(c.v),
      (c.v===best&&isFinite(best)&&st.changed.includes(n)&&st.P[n][st.P[n].length-2]===c.j)?'best':''));
  }
}

function renderPractice(st,D,done){
  const box=$('practiceBox');box.hidden=!practice;if(!practice)return;
  let h='';
  if(done)h='<p><b>Ejercicio completo.</b> Aciertos: '+score.ok+' de '+score.tries+'. Pulsa Reiniciar para repetir.</p>';
  else if(D)h='<p><b>Tu turno:</b> haz clic en el nodo que entra a T en la siguiente iteración.</p>';
  else h='<p><b>Tu turno:</b> marca en la red los nodos cuyo L'+sub(st.h+1)+' será menor que L'+sub(st.h)+'. Si crees que ninguno cambia, comprueba sin marcar.</p>'+
    '<div class="row"><button class="btn amber" id="b-check">Comprobar'+(pick.size?' ('+[...pick].sort().join(', ')+')':': ninguno cambia')+'</button></div>';
  if(fb)h+='<p class="feedback '+(fb.ok?'ok':'no')+'">'+fb.text+'</p>';
  h+='<p class="score">Aciertos '+score.ok+' / '+score.tries+'</p>';
  box.innerHTML=h;const bc=$('b-check');if(bc)bc.onclick=bCheck;
}

function renderGraph(st,D){
  const svg=$('graph');let s='<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--teal)"/></marker></defs>';
  // enlaces base
  EDGES.forEach(([a,b])=>{const [x1,y1]=POS[a],[x2,y2]=POS[b];s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--line)" stroke-width="2.5"/>';});
  // árbol de caminos actual
  N.forEach(n=>{const p=st.P[n];if(!p||p.length<2)return;const a=p[p.length-2];let [x1,y1]=POS[a],[x2,y2]=POS[n];
    const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),r=26;x1+=dx/L*r;y1+=dy/L*r;x2-=dx/L*(r+2);y2-=dy/L*(r+2);
    const firm=D?st.T.includes(n):true;
    s+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--teal)" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr)"'+(firm?'':' stroke-dasharray="7 6" opacity=".85"')+'/>';});
  // costes dirigidos
  EDGES.forEach(([a,b])=>{[[a,b],[b,a]].forEach(([i,j])=>{const [x1,y1]=POS[i],[x2,y2]=POS[j];const t=.3;const cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t;
    s+='<g><rect x="'+(cx-11)+'" y="'+(cy-10)+'" width="22" height="20" rx="5" fill="var(--surface)" stroke="var(--line)"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-family="var(--f-mono)" font-size="13" font-weight="600" fill="var(--ink)">'+W(i,j)+'</text></g>';});});
  // nodos
  const chg=new Set(st.changed);
  N.forEach(n=>{const [x,y]=POS[n];const isSrc=n===src,inT=D?st.T.includes(n):isFinite(st.L[n]);
    const fill=isSrc?'var(--amber)':inT&&D?'var(--teal)':!D&&inT?'var(--teal)':'var(--surface)';
    const tc=isSrc?'var(--on-amber)':(inT?'var(--on-teal)':'var(--ink)');
    const ringC=chg.has(n)?'var(--amber)':(pick.has(n)?'var(--ink)':'transparent');
    const cls='node'+(flash.includes(n)?' flash':'')+(wrong===n?' wrong':'');
    s+='<g class="'+cls+'" data-n="'+n+'" tabindex="0" role="button" aria-label="Nodo '+n+', L = '+f(st.L[n])+'">'+
      '<circle class="ring" cx="'+x+'" cy="'+y+'" r="27" fill="none" stroke="'+ringC+'" stroke-width="4"'+(pick.has(n)?' stroke-dasharray="5 4"':'')+'/>'+
      '<circle cx="'+x+'" cy="'+y+'" r="21" fill="'+fill+'" stroke="'+(inT||isSrc?'transparent':'var(--muted)')+'" stroke-width="2"/>'+
      '<text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-family="var(--f-body)" font-size="18" font-weight="600" fill="'+tc+'">'+n+'</text>';
    const by=BADGE_UP[n]?y-46:y+50;
    s+='<text x="'+x+'" y="'+by+'" text-anchor="middle" font-family="var(--f-mono)" font-size="14" font-weight="600" fill="'+(chg.has(n)?'var(--ink)':'var(--muted)')+'">'+(isSrc?'origen':'L='+f(st.L[n]))+'</text></g>';});
  svg.innerHTML=s;wrong=null;
  svg.querySelectorAll('.node').forEach(g=>{const n=+g.dataset.n;g.onclick=()=>nodeClick(n);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nodeClick(n);}};});
  flash=[];
  const lg=$('legend');
  lg.innerHTML='<span><i class="dot" style="background:var(--amber)"></i>Origen</span>'+
    '<span><i class="dot" style="background:var(--teal)"></i>'+(D?'En T (definitivo)':'Alcanzado')+'</span>'+
    '<span><i class="dot" style="border-color:var(--amber)"></i>Cambió en este paso</span>'+
    '<span><svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--teal)" stroke-width="3.5"/></svg>Camino actual'+(D?' (punteado = provisional)':'')+'</span>'+
    '<span>Número sobre el enlace = coste saliendo del nodo más cercano</span>';
}

function cell(L,P,n,up){return '<td class="'+(up?'upd':'')+'">'+f(L[n])+(isFinite(L[n])&&n!==src?'<small>'+ps(P[n])+'</small>':'')+'</td>';}
function renderTable(D){
  const t=$('table'),o=others();
  $('tableTitle').textContent=D?'Tabla de iteraciones (formato Tabla 10.4a)':'Tabla por número de enlaces h (formato Tabla 10.4b)';
  let h='<thead><tr>'+(D?'<th>It.</th><th>T</th>':'<th>h</th>')+o.map(n=>'<th>L('+n+')</th>').join('')+'</tr></thead><tbody>';
  hist.forEach((st,i)=>{const chg=new Set(st.changed);const last=i===hist.length-1;
    h+='<tr class="'+(last?'cur':'')+'">'+(D?'<td class="lbl">'+(i+1)+'</td><td class="lbl">{'+st.T.join(',')+'}</td>':'<td class="lbl">'+st.h+'</td>')+
      o.map(n=>cell(st.L,st.P,n,chg.has(n))).join('')+'</tr>';});
  t.innerHTML=h+'</tbody>';
}
function renderResult(st,done){
  $('resultBox').hidden=!done;if(!done)return;
  let h='<thead><tr><th>Destino</th><th>Coste mínimo</th><th>Camino</th><th>Siguiente nodo</th></tr></thead><tbody>';
  others().forEach(n=>{h+='<tr><td>'+n+'</td><td>'+f(st.L[n])+'</td><td>'+ps(st.P[n])+'</td><td>'+st.P[n][1]+'</td></tr>';});
  $('result').innerHTML=h+'</tbody>';
  $('resultNote').textContent='La columna "Siguiente nodo" es la fila del nodo '+src+' en la matriz de encaminamiento estático (Fig. 10.7). Dijkstra y Bellman-Ford llegan al mismo resultado.';
}

/* ---------- Eventos ---------- */
function setAlgo(a){algo=a;history.replaceState(null,'',a==='dijkstra'?'#dijkstra':'#bellman-ford');score={ok:0,tries:0};reset();}
$('tab-dijkstra').onclick=()=>setAlgo('dijkstra');
$('tab-bellman').onclick=()=>setAlgo('bellman');
$('b-reset').onclick=()=>{score={ok:0,tries:0};reset();};
$('b-next').onclick=()=>{stop();next(false);};
$('b-back').onclick=back;
$('b-play').onclick=play;
$('src').onchange=e=>{src=+e.target.value;score={ok:0,tries:0};reset();};
$('practice').onchange=e=>{practice=e.target.checked;stop();score={ok:0,tries:0};reset();};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){stop();next(false);}if(e.key==='ArrowLeft')back();});
window.addEventListener('hashchange',()=>{const a=location.hash==='#bellman-ford'?'bellman':'dijkstra';if(a!==algo){algo=a;reset();}});
let start='dijkstra';if(location.hash==='#bellman-ford')start='bellman';else if(!location.hash){try{if(localStorage.getItem('mc-algo')==='bellman')start='bellman'}catch(e){}}
algo=start;reset();
window.__mc={get hist(){return hist},setAlgo,next,setSrc(v){src=v;reset();}};
})();
</script>

</body></html>
